name: Authoritative Linux CI

on:
  pull_request:
  push:
    branches:
      - main
      - ci/**
      - r0/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authoritative-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-change:
    name: Governed change classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      enforced_pipeline: ${{ steps.classify.outputs.enforced_pipeline }}
      risk: ${{ steps.classify.outputs.risk }}

    steps:
      - name: Checkout exact history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Classify exact delta fail closed
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          force_full=""
          head="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^)"
            force_full="workflow-dispatch"
          fi
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
            force_full="unavailable-base"
          fi
          if ! git diff --quiet "${base}" "${head}" -- \
            .github/workflows/authoritative-linux-ci.yml \
            scripts/classify-workflow-change.mjs \
            scripts/verify-docs-only.mjs \
            scripts/lib/workflow-change-classifier.mjs \
            scripts/lib/docs-only-verification.mjs; then
            force_full="classification-policy-change"
          fi
          args=(
            --base "${base}"
            --head "${head}"
            --output "${RUNNER_TEMP}/WORKFLOW_CHANGE_RISK.json"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${force_full}" ]]; then
            args+=(--force-full-reason "${force_full}")
          fi
          node scripts/classify-workflow-change.mjs "${args[@]}"
          echo "base_sha=${base}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${head}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node scripts/check-work-unit.mjs \
              --mode PROMOTION \
              --branch "${{ github.head_ref }}" \
              --head "${head}"
          fi
          node scripts/verify-preview-migration-state.mjs \
            --phase pre-merge \
            --output "${RUNNER_TEMP}/PREVIEW_MIGRATION_PREFLIGHT.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload classification and migration preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-change-risk
          path: |
            ${{ runner.temp }}/WORKFLOW_CHANGE_RISK.json
            ${{ runner.temp }}/PREVIEW_MIGRATION_PREFLIGHT.json
          if-no-files-found: error
          retention-days: 30

  docs-only-gate:
    name: DOCS_ONLY fail-closed
    needs:
      - classify-change
    if: needs.classify-change.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.classify-change.outputs.candidate_sha }}

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate exact pnpm with Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.15.1"

      - name: Verify DOCS_ONLY contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-workflow-stage.mjs \
            --metrics "${RUNNER_TEMP}/DOCS_ONLY_METRICS.json" \
            --stage docs-only-contract \
            -- node scripts/verify-docs-only.mjs \
              --base "${{ needs.classify-change.outputs.base_sha }}" \
              --head "${{ needs.classify-change.outputs.candidate_sha }}" \
              --output "${RUNNER_TEMP}/DOCS_ONLY_EVIDENCE.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload DOCS_ONLY evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-only-evidence
          path: |
            ${{ runner.temp }}/DOCS_ONLY_EVIDENCE.json
            ${{ runner.temp }}/DOCS_ONLY_METRICS.json
          if-no-files-found: error
          retention-days: 30

  authoritative-gate:
    name: VC-024 ${{ matrix.execution }}
    needs:
      - classify-change
    if: needs.classify-change.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SR_WORKFLOW_METRICS_FILE: WORKFLOW_METRICS-${{ matrix.execution }}.json
    services:
      compiled-smoke-postgresql:
        image: postgres@sha256:d93de42662696f278fb34354b06fdaa90ad7ca3106d6f72fbd01d16da006d2cf
        env:
          POSTGRES_DB: srtaller_compiled_smoke
          POSTGRES_USER: srtaller_compiled_smoke
          POSTGRES_PASSWORD: synthetic-ci-compiled-smoke-password
        options: >-
          --health-cmd "pg_isready --username=srtaller_compiled_smoke --dbname=srtaller_compiled_smoke"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 30
          --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=256m
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        execution:
          - run-1
          - run-2

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.classify-change.outputs.candidate_sha }}

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate exact pnpm with Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.15.1"

      - name: Verify authoritative runner and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          ldd --version | head -n 1 | grep -Ei 'glibc|GNU libc'
          test "$(git rev-parse HEAD)" = "${{ needs.classify-change.outputs.candidate_sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install from frozen lockfile
        run: >-
          node scripts/run-workflow-stage.mjs
          --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}"
          --stage install
          -- pnpm install --frozen-lockfile

      - name: Run atomic canonical base verification
        run: >-
          node scripts/run-workflow-stage.mjs
          --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}"
          --stage base-verify
          -- pnpm run verify

      - name: Prepare compiled smoke PostgreSQL schema
        run: >-
          node scripts/run-workflow-stage.mjs
          --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}"
          --stage compiled-smoke-migration
          -- pnpm run db:migrate
        env:
          SR_DB_ENVIRONMENT: development
          SR_DB_HOST: 127.0.0.1
          SR_DB_PORT: "5432"
          SR_DB_NAME: srtaller_compiled_smoke
          SR_DB_USER: srtaller_compiled_smoke
          SR_DB_PASSWORD: synthetic-ci-compiled-smoke-password
          SR_DB_SSL_MODE: disable
          SR_DB_POOL_MIN: "0"
          SR_DB_POOL_MAX: "3"
          SR_DB_IDLE_TIMEOUT_MS: "1000"
          SR_DB_CONNECTION_TIMEOUT_MS: "2000"
          SR_DB_STATEMENT_TIMEOUT_MS: "2000"
          SR_DB_QUERY_TIMEOUT_MS: "2000"
          SR_DB_APPLICATION_NAME: srtaller-ci-compiled-smoke-migrator
          SR_DB_ROLE: migration
          SR_DB_ACCESS_MODE: read-write
          SR_DB_MIGRATIONS_ENABLED: "true"

      - name: Run PostgreSQL 18.4 persistence suites
        env:
          VC024_EXECUTION_LABEL: ${{ matrix.execution }}
          SR_PG_CI_EXECUTION_LABEL: ${{ matrix.execution }}
        shell: bash
        run: |
          set -euo pipefail
          postgresql_dir="${RUNNER_TEMP}/pbi023-postgresql-${VC024_EXECUTION_LABEL}"
          mkdir -p "${postgresql_dir}"
          node scripts/run-workflow-stage.mjs \
            --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" \
            --stage postgresql-composite \
            -- node scripts/run-postgresql-ci.mjs \
              --output "${postgresql_dir}/POSTGRESQL_MANIFEST.json" \
              --head-sha "${{ needs.classify-change.outputs.candidate_sha }}"

      - name: Run PBI-039 PostgreSQL 18.4 contracts
        env:
          SR_PG_CI_EXECUTION_LABEL: ${{ matrix.execution }}
        shell: bash
        run: |
          set -euo pipefail
          postgresql_dir="${RUNNER_TEMP}/pbi039-postgresql-${SR_PG_CI_EXECUTION_LABEL}"
          mkdir -p "${postgresql_dir}"
          node scripts/run-workflow-stage.mjs \
            --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" \
            --stage pbi039-postgresql \
            -- node scripts/test-pbi039-postgresql.mjs \
              --runs 1 \
              --output "${postgresql_dir}/PBI039_POSTGRESQL_MANIFEST.json" \
              --head-sha "${{ needs.classify-change.outputs.candidate_sha }}"

      - name: Run TL-02 PostgreSQL 18.4 contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-workflow-stage.mjs \
            --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" \
            --stage tl02-postgresql \
            -- node scripts/test-tl02-postgresql.mjs

      - name: Run TL-03 PostgreSQL 18.4 contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-workflow-stage.mjs \
            --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" \
            --stage tl03-postgresql \
            -- node scripts/test-tl03-postgresql.mjs

      - name: Run TL-04 PostgreSQL 18.4 contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-workflow-stage.mjs \
            --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" \
            --stage tl04-postgresql \
            -- node scripts/test-tl04-postgresql.mjs

      - name: Cleanup PostgreSQL persistence suites
        if: always()
        env:
          SR_PG_CI_EXECUTION_LABEL: ${{ matrix.execution }}
        run: >-
          node scripts/run-workflow-stage.mjs
          --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}"
          --stage postgresql-cleanup
          -- node scripts/cleanup-postgresql-ci.mjs

      - name: Run compiled artifact smoke
        run: >-
          node scripts/run-workflow-stage.mjs
          --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}"
          --stage compiled-backend-smoke
          -- pnpm run smoke:start
        env:
          SR_DB_ENVIRONMENT: development
          SR_DB_HOST: 127.0.0.1
          SR_DB_PORT: "5432"
          SR_DB_NAME: srtaller_compiled_smoke
          SR_DB_USER: srtaller_compiled_smoke
          SR_DB_PASSWORD: synthetic-ci-compiled-smoke-password
          SR_DB_SSL_MODE: disable
          SR_DB_POOL_MIN: "0"
          SR_DB_POOL_MAX: "3"
          SR_DB_IDLE_TIMEOUT_MS: "1000"
          SR_DB_CONNECTION_TIMEOUT_MS: "2000"
          SR_DB_STATEMENT_TIMEOUT_MS: "2000"
          SR_DB_QUERY_TIMEOUT_MS: "2000"
          SR_DB_APPLICATION_NAME: srtaller-ci-compiled-smoke-runtime
          SR_DB_ROLE: application
          SR_DB_ACCESS_MODE: read-write
          SR_DB_MIGRATIONS_ENABLED: "false"
          SR_PIN_PEPPER: NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ
          SR_ADMIN_PASSWORD_PEPPER: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU
          SR_REGISTRATION_ABUSE_PEPPER: SEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEg

      - name: Run compiled UI route smoke
        run: >-
          node scripts/run-workflow-stage.mjs
          --metrics "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}"
          --stage compiled-ui-smoke
          -- pnpm run smoke:ui
        env:
          SR_DB_ENVIRONMENT: development
          SR_DB_HOST: 127.0.0.1
          SR_DB_PORT: "5432"
          SR_DB_NAME: srtaller_compiled_smoke
          SR_DB_USER: srtaller_compiled_smoke
          SR_DB_PASSWORD: synthetic-ci-compiled-smoke-password
          SR_DB_SSL_MODE: disable
          SR_DB_POOL_MIN: "0"
          SR_DB_POOL_MAX: "3"
          SR_DB_IDLE_TIMEOUT_MS: "1000"
          SR_DB_CONNECTION_TIMEOUT_MS: "2000"
          SR_DB_STATEMENT_TIMEOUT_MS: "2000"
          SR_DB_QUERY_TIMEOUT_MS: "2000"
          SR_DB_APPLICATION_NAME: srtaller-ci-compiled-ui-smoke-runtime
          SR_DB_ROLE: application
          SR_DB_ACCESS_MODE: read-write
          SR_DB_MIGRATIONS_ENABLED: "false"
          SR_PIN_PEPPER: NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ
          SR_ADMIN_PASSWORD_PEPPER: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU
          SR_REGISTRATION_ABUSE_PEPPER: SEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEg

      - name: Check whitespace and repository immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Collect sanitized VC-024 evidence and shadow attestation
        env:
          VC024_EXECUTION_LABEL: ${{ matrix.execution }}
          VC024_INITIAL_CLEAN: "true"
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/vc024-${VC024_EXECUTION_LABEL}"
          mkdir -p "${evidence_dir}"
          node scripts/collect-ci-evidence.mjs \
            --output "${evidence_dir}/EVIDENCE_MANIFEST.json" \
            --dist-output "${evidence_dir}/DIST_MANIFEST.json" \
            --metrics-input "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" \
            --postgresql-input \
              "${RUNNER_TEMP}/pbi023-postgresql-${VC024_EXECUTION_LABEL}/POSTGRESQL_MANIFEST.json" \
            --pbi039-postgresql-input \
              "${RUNNER_TEMP}/pbi039-postgresql-${VC024_EXECUTION_LABEL}/PBI039_POSTGRESQL_MANIFEST.json"
          node scripts/create-verified-tree-attestation.mjs \
            --output "${evidence_dir}/VERIFIED_TREE_ATTESTATION.json"
          cp "${RUNNER_TEMP}/${SR_WORKFLOW_METRICS_FILE}" "${evidence_dir}/WORKFLOW_METRICS.json"
          cp \
            "${RUNNER_TEMP}/pbi023-postgresql-${VC024_EXECUTION_LABEL}/POSTGRESQL_MANIFEST.json" \
            "${evidence_dir}/POSTGRESQL_MANIFEST.json"
          cp \
            "${RUNNER_TEMP}/pbi039-postgresql-${VC024_EXECUTION_LABEL}/PBI039_POSTGRESQL_MANIFEST.json" \
            "${evidence_dir}/PBI039_POSTGRESQL_MANIFEST.json"

      - name: Upload sanitized execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: vc024-${{ matrix.execution }}
          path: ${{ runner.temp }}/vc024-${{ matrix.execution }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure metrics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-failure-metrics-${{ matrix.execution }}
          path: ${{ runner.temp }}/WORKFLOW_METRICS-${{ matrix.execution }}.json
          if-no-files-found: warn
          retention-days: 30

  compare-authoritative-gates:
    name: VC-024 comparison
    needs:
      - classify-change
      - authoritative-gate
    if: >-
      always() &&
      needs.classify-change.outputs.docs_only != 'true' &&
      needs.authoritative-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout comparison code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.classify-change.outputs.candidate_sha }}

      - name: Set up comparison Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Download first execution evidence
        uses: actions/download-artifact@v4
        with:
          name: vc024-run-1
          path: ${{ runner.temp }}/vc024-inputs/run-1

      - name: Download second execution evidence
        uses: actions/download-artifact@v4
        with:
          name: vc024-run-2
          path: ${{ runner.temp }}/vc024-inputs/run-2

      - name: Compare semantic results, artifact hashes and shadow attestation
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/vc024-comparison"
          mkdir -p "${output_dir}"
          node scripts/compare-ci-evidence.mjs \
            --left "${RUNNER_TEMP}/vc024-inputs/run-1/EVIDENCE_MANIFEST.json" \
            --right "${RUNNER_TEMP}/vc024-inputs/run-2/EVIDENCE_MANIFEST.json" \
            --output "${output_dir}/COMPARISON.json"
          node scripts/compare-verified-tree-attestations.mjs \
            --left "${RUNNER_TEMP}/vc024-inputs/run-1/VERIFIED_TREE_ATTESTATION.json" \
            --right "${RUNNER_TEMP}/vc024-inputs/run-2/VERIFIED_TREE_ATTESTATION.json" \
            --output "${output_dir}/VERIFIED_TREE_COMPARISON.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc024-comparison
          path: ${{ runner.temp }}/vc024-comparison/
          if-no-files-found: error
          retention-days: 30

  promotion-gate:
    name: Authoritative promotion gate
    needs:
      - classify-change
      - docs-only-gate
      - authoritative-gate
      - compare-authoritative-gates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require the selected authoritative path
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify-change.result }}
          DOCS_ONLY: ${{ needs.classify-change.outputs.docs_only }}
          DOCS_ONLY_RESULT: ${{ needs.docs-only-gate.result }}
          FULL_RESULT: ${{ needs.authoritative-gate.result }}
          COMPARISON_RESULT: ${{ needs.compare-authoritative-gates.result }}
        shell: bash
        run: |
          set -euo pipefail

          test "${CLASSIFICATION_RESULT}" = "success"

          if [[ "${DOCS_ONLY}" == "true" ]]; then
            test "${DOCS_ONLY_RESULT}" = "success"
            test "${FULL_RESULT}" = "skipped"
            test "${COMPARISON_RESULT}" = "skipped"
          else
            test "${DOCS_ONLY_RESULT}" = "skipped"
            test "${FULL_RESULT}" = "success"
            test "${COMPARISON_RESULT}" = "success"
          fi
